name: Chain snapshot (manual)

# Retired as a DAILY job on 2026-11-13. options-data-journal is the fleet's one chain snapshotter (two slots a day,
# idempotent per ticker/date/slot, schema-checked); this workflow stored the same SPY/QQQ/IWM chains a second time.
# It stays as a manual run for the one thing ODJ does not produce: the H8 put ladder JSON.
# To bring the daily run back, restore:
#   schedule:
#     - cron: "50 20 * * 1-5"   # 15:50 ET during standard time
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the 15:40-16:10 ET window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chain-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check New York time window
        id: guard
        run: |
          now=$(TZ=America/New_York date +%H%M)
          echo "New York time is $now"
          if [ "${{ github.event.inputs.force }}" = "true" ] || { [ "$now" -ge 1540 ] && [ "$now" -le 1610 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the window; skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      # A missing TRADIER_TOKEN used to fall back to yfinance SILENTLY. Now it fails loudly (Discord notice + red run)
      # unless the repo Variable PROVIDER_ALLOW_FALLBACK is exactly 1.
      - name: Resolve quote provider
        id: provider
        if: steps.guard.outputs.run == 'true'
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          PROVIDER_ALLOW_FALLBACK: ${{ vars.PROVIDER_ALLOW_FALLBACK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/resolve_provider.py

      - name: Snapshot and export
        if: steps.guard.outputs.run == 'true'
        env:
          TRADING_OPS_DB: ${{ runner.temp }}/snap.db
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
        run: |
          set -euo pipefail
          day=$(TZ=America/New_York date +%F)
          echo "Provider: $PROVIDER"
          python -m trading_ops snapshot --provider "$PROVIDER" --symbols SPY,QQQ,IWM --slot close --max-dte 30
          mkdir -p data/chains
          python -m trading_ops export-chains --date "$day" --slot close --out "data/chains/${day}_close.csv.gz"
          python -m trading_ops ladder --date "$day" --slot close > "data/chains/${day}_h8_ladder.json"

      - name: Commit data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "trading-ops-bot"
          git config user.email "trading-ops-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "chain snapshot $(TZ=America/New_York date +%F)" && git push; fi

      - name: Tell Discord if this run failed
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py "trading-ops chain snapshot"
