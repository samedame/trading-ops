name: Daily chain snapshot

# GitHub cron can drift by hours. The guard below accepts a New York weekday run from 15:40 to 23:30 ET, once per day.
on:
  schedule:
    - cron: "50 19 * * 1-5"   # 15:50 ET during daylight time
    - cron: "50 20 * * 1-5"   # 15:50 ET during standard time
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the 15:40-23:30 ET window or if today already has a file"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chain-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub cron routinely fires hours late (observed 3-5 h in Nov 2026), so a +/-15 min window skipped every
      # scheduled run. Now: run on any New York weekday from 15:40 to 23:30 (before midnight, because the data is
      # stamped with the New York date), and skip if today's file already exists so the earliest run wins.
      - name: Check New York time window
        id: guard
        run: |
          now=$(TZ=America/New_York date +%H%M)
          dow=$(TZ=America/New_York date +%u)
          day=$(TZ=America/New_York date +%F)
          echo "New York time is $now (weekday $dow, $day)"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$dow" -ge 6 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Weekend in New York; skipping."
          elif [ -f "data/chains/${day}_close.csv.gz" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Today's snapshot already exists; skipping."
          elif [ "$now" -ge 1540 ] && [ "$now" -le 2330 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Outside 15:40-23:30 ET; skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      # A missing TRADIER_TOKEN used to fall back to yfinance SILENTLY. Now it fails loudly (Discord notice + red run)
      # unless the repo Variable PROVIDER_ALLOW_FALLBACK is exactly 1.
      - name: Resolve quote provider
        id: provider
        if: steps.guard.outputs.run == 'true'
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          PROVIDER_ALLOW_FALLBACK: ${{ vars.PROVIDER_ALLOW_FALLBACK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/resolve_provider.py

      - name: Snapshot and export
        if: steps.guard.outputs.run == 'true'
        env:
          TRADING_OPS_DB: ${{ runner.temp }}/snap.db
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
        run: |
          set -euo pipefail
          day=$(TZ=America/New_York date +%F)
          echo "Provider: $PROVIDER"
          python -m trading_ops snapshot --provider "$PROVIDER" --symbols SPY,QQQ,IWM --slot close --max-dte 30
          mkdir -p data/chains
          python -m trading_ops export-chains --date "$day" --slot close --out "data/chains/${day}_close.csv.gz"
          python -m trading_ops ladder --date "$day" --slot close > "data/chains/${day}_h8_ladder.json"

      - name: Commit data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "trading-ops-bot"
          git config user.email "trading-ops-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "chain snapshot $(TZ=America/New_York date +%F)" && git push; fi

      - name: Tell Discord if this run failed
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py "trading-ops chain snapshot"
