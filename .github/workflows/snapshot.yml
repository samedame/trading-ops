name: Daily chain snapshot

# GitHub cron can drift by many minutes (you have seen this with the IBS bot). The guard below only
# accepts a run that lands between 15:40 and 16:10 New York time, so a drifted run is skipped, not wrong.
on:
  schedule:
    - cron: "50 19 * * 1-5"   # 15:50 ET during daylight time
    - cron: "50 20 * * 1-5"   # 15:50 ET during standard time
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the 15:40-16:10 ET window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chain-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check New York time window
        id: guard
        run: |
          now=$(TZ=America/New_York date +%H%M)
          echo "New York time is $now"
          if [ "${{ github.event.inputs.force }}" = "true" ] || { [ "$now" -ge 1540 ] && [ "$now" -le 1610 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the window; skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Snapshot and export
        if: steps.guard.outputs.run == 'true'
        env:
          TRADING_OPS_DB: ${{ runner.temp }}/snap.db
        run: |
          set -euo pipefail
          day=$(TZ=America/New_York date +%F)
          python -m trading_ops snapshot --symbols SPY,QQQ,IWM --slot close --max-dte 30
          mkdir -p data/chains
          python -m trading_ops export-chains --date "$day" --slot close --out "data/chains/${day}_close.csv.gz"
          python -m trading_ops ladder --date "$day" --slot close > "data/chains/${day}_h8_ladder.json"

      - name: Commit data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "trading-ops-bot"
          git config user.email "trading-ops-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "chain snapshot $(TZ=America/New_York date +%F)" && git push; fi
